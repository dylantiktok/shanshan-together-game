<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>姗姗王情侣桌球</title><style>*{box-sizing:border-box}body{margin:0;background:#151d27;color:#fff;font-family:system-ui,sans-serif;touch-action:none}main{max-width:760px;margin:auto;padding:12px}h1{text-align:center;margin:4px;font-size:24px}.sub{text-align:center;color:#b9c8d6;font-size:13px}.bar{display:flex;justify-content:center;align-items:center;gap:10px;margin:10px}.bar button{border:0;border-radius:10px;padding:9px 14px;background:#ef8b91;color:#fff;font-weight:700}.score{text-align:center;color:#ffe5ae}.wrap{position:relative;width:min(94vw,720px);margin:auto}.wrap canvas{display:block;width:100%;border-radius:18px;box-shadow:0 0 0 5px #39434d,0 8px 28px #0008}.tip{text-align:center;color:#c7d3dc;font-size:13px;margin:10px}.back{display:block;text-align:center;color:#ffc9c9;text-decoration:none;margin:12px}</style><main><h1>姗姗王情侣桌球 🎱</h1><div class="sub">轮流击球，进球后继续；把最后的黑八送进球袋</div><div class="bar"><span class="score" id="score"></span><button id="new">新开一局</button></div><div class="wrap"><canvas id="c" width="720" height="390"></canvas></div><div class="tip" id="tip">拖动白球向后拉，松手击球</div><a class="back" href="./">← 回到一起消消</a></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=720,H=390,R=13,fr=.986;let balls=[],turn=0,aim=null,moving=false,scores=[0,0],over=false;
const holes=[[20,20],[360,13],[700,20],[20,370],[360,377],[700,370]];
function reset(){balls=[{x:180,y:195,vx:0,vy:0,k:-1}];let colors=['#f5d447','#3c8edb','#e94c4c','#8d55c4','#f08c37','#31a36c','#df5a88','#222'];colors.forEach((col,i)=>{let row=Math.floor(i/3),j=i%3;balls.push({x:505+row*27,y:157+j*28-row*14,vx:0,vy:0,k:i,col})});scores=[0,0];turn=0;over=false;aim=null;draw();say('拖动白球向后拉，松手击球')}
function say(t){document.querySelector('#tip').textContent=t;document.querySelector('#score').textContent=over?'🎉 '+(scores[0]>scores[1]?'桃桃':'熊熊')+'获胜！':'桃桃 '+scores[0]+' : '+scores[1]+' 熊熊 · '+(turn?'熊熊':'桃桃')+'回合'}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#116044';x.fillRect(0,0,W,H);x.strokeStyle='#0b3b2b';x.lineWidth=18;x.strokeRect(9,9,W-18,H-18);holes.forEach(h=>{x.fillStyle='#101820';x.beginPath();x.arc(h[0],h[1],20,0,7);x.fill()});balls.forEach(b=>{x.fillStyle=b.k<0?'#fff':b.col;x.beginPath();x.arc(b.x,b.y,R,0,7);x.fill();x.strokeStyle='#ffffff77';x.stroke()});if(aim&&!moving){x.strokeStyle='#ffffffaa';x.lineWidth=2;x.beginPath();x.moveTo(aim.b.x,aim.b.y);x.lineTo(aim.p.x,aim.p.y);x.stroke();x.fillStyle='#fff8';x.beginPath();x.arc(aim.b.x,aim.b.y,18,0,7);x.stroke()}}
function pos(e){let q=e.touches?e.touches[0]:e, r=c.getBoundingClientRect();return{x:(q.clientX-r.left)*W/r.width,y:(q.clientY-r.top)*H/r.height}}
function hit(p){return Math.hypot(p.x-180,p.y-195)<25&&!moving&&!over}
c.addEventListener('pointerdown',e=>{let p=pos(e);if(hit(p)){aim={b:{x:180,y:195},p};c.setPointerCapture(e.pointerId)}});
c.addEventListener('pointermove',e=>{if(aim){aim.p=pos(e);draw()}});
c.addEventListener('pointerup',e=>{if(!aim)return;let dx=aim.b.x-aim.p.x,dy=aim.b.y-aim.p.y,len=Math.min(Math.hypot(dx,dy),150);if(len>8){balls[0].vx=dx/len*len*.055;balls[0].vy=dy/len*len*.055;moving=true;aim=null;loop()}else{aim=null;draw()}});
function loop(){let active=false;balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vx*=fr;b.vy*=fr;if(Math.abs(b.vx)+Math.abs(b.vy)>.08)active=true;if(b.x<R+18||b.x>W-R-18)b.vx*=-1;if(b.y<R+18||b.y>H-R-18)b.vy*=-1});for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<2*R){let nx=dx/d,ny=dy/d,rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx;a.vy-=rel*ny;b.vx+=rel*nx;b.vy+=rel*ny}let push=(2*R-d)/2;a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push}}for(let i=balls.length-1;i>=0;i--){let b=balls[i],h=holes.find(h=>Math.hypot(h[0]-b.x,h[1]-b.y)<22);if(h){if(b.k===-1){b.x=180;b.y=195;b.vx=b.vy=0}else{balls.splice(i,1);scores[turn]++}}}draw();if(active){requestAnimationFrame(loop)}else if(moving){moving=false;turn=1-turn;if(balls.length<=1)over=true;say(over?'本局结束！点击新开一局':'轮到另一位，继续加油');draw()}}
document.querySelector('#new').onclick=reset;reset();
</script></html>
