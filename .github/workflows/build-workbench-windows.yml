# 在 GitHub 的 Windows 机器上构建 AOKEMENG 工作台安装包（.exe）
# - 推送到分支（改动 aokemeng-workbench/ 时）或手动触发：构建结果在 Actions 运行页面的 Artifacts 中下载
# - 推送 workbench-v* 标签，或手动运行时填写“发布版本标签”（如 workbench-v0.1.0）：额外发布到 GitHub Releases
name: Build Workbench (Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本标签（如 workbench-v0.1.0）；留空则只构建，不发布'
        required: false
        default: ''
  push:
    paths:
      - 'aokemeng-workbench/**'
      - '.github/workflows/build-workbench-windows.yml'
    tags:
      - 'workbench-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aokemeng-workbench
    env:
      # electron-builder 会自行下载打包用的 Electron，这里跳过开发用的下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aokemeng-workbench/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AOKEMENG-Workbench-Setup
          path: aokemeng-workbench/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AOKEMENG 运营工作台 ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          body: |
            AOKEMENG TikTok 智能运营工作台 Windows 安装包。

            **安装方法**
            1. 下载下方的 `AOKEMENG-Workbench-Setup-*.exe`
            2. 双击安装（无需管理员权限），完成后桌面会出现“AOKEMENG 运营工作台”
            3. 安装包暂未进行代码签名：如出现“Windows 已保护你的电脑”，点击“更多信息” →“仍要运行”

            数据保存在本机 `%APPDATA%\AOKEMENG TikTok Operations Workbench\data\`，升级或卸载不会删除数据。
          files: aokemeng-workbench/dist/*.exe
